      '<td><span class="badge b-user">'+esc(u.role)+'</span></td>'+
      '<td class="u-t-dim">'+esc(u.archivedAt || '—')+'</td>'+
      '<td><div class="u-t-acts"><button class="btn-line" onclick="adminRestoreUser(\''+esc(u.login)+'\')">Восстановить</button></div></td>'+
    '</tr>';

    cards += '<div class="u-card">'+
      '<div class="u-hd">'+
        '<div class="u-fio">'+esc(u.fio)+'</div>'+
        '<span class="badge b-user">'+esc(u.role)+'</span>'+
      '</div>'+
      '<div class="u-meta">'+
        'Логин: <b>'+esc(u.login)+'</b>'+
        (u.phone ? ' · Тел: '+esc(u.phone) : '') +
        '<br>В архиве с: '+esc(u.archivedAt || '—') +
      '</div>'+
      '<div class="u-acts">'+
        '<button class="btn-line" onclick="adminRestoreUser(\''+esc(u.login)+'\')">'+ic('undo')+'Восстановить</button>'+
      '</div>'+
    '</div>';
  });

  h += '<div class="tblwrap u-tblwrap"><table class="co-tbl u-tbl">'+
    '<thead><tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>В архиве с</th><th>Действия</th></tr></thead>'+
    '<tbody>'+rows+'</tbody>'+
  '</table></div>';
  h += '<div class="u-cards">'+cards+'</div>';

  $('adminContent').innerHTML = h;
}

// ─── Вкладка: Оргструктура ───
function loadAdminDivisions(){
  call('apiAdminGetDivisions', S.token).then(function(r){
    if(!r || !r.ok){
      $('adminContent').innerHTML = '<div class="err">'+esc((r&&r.error)||'Ошибка загрузки оргструктуры')+'</div>';
      return;
    }
    S.adminDivs = r.divisions || [];
    renderAdminDivisions();
  }).catch(function(){
    $('adminContent').innerHTML = '<div class="err">Нет связи с сервером</div>';
  });
}

function renderAdminDivisions(){
  var divs = S.adminDivs || [];
  var search = ($('divSearch') ? $('divSearch').value : '').toLowerCase();

  var filtered = divs.filter(function(d){
    return !search || d.unit.toLowerCase().indexOf(search) >= 0 || d.dir.toLowerCase().indexOf(search) >= 0 ||
      d.resp.toLowerCase().indexOf(search) >= 0 || d.hrbp.toLowerCase().indexOf(search) >= 0;
  });

  var h = '<div class="dash-filters">'+
    '<div class="search-wrap">'+icBare('search')+
      '<input id="divSearch" placeholder="Поиск по отделу, направлению, ответственным…" value="'+esc(search)+'"></div>'+
  '</div>';

  h += '<div class="sec-title">Оргструктура подразделений ('+filtered.length+')</div>';

  h += '<div class="tblwrap"><table class="co-tbl">'+
    '<tr><th>Направление / Отдел</th><th>Руководитель / Ответственный</th><th>HR BP</th><th>Действия</th></tr>'+
    filtered.map(function(d, idx){
      return '<tr>'+
        '<td><b>'+esc(d.unit)+'</b><br><small style="color:var(--muted)">'+esc(d.dir)+'</small></td>'+
        '<td>'+(d.resp ? esc(d.resp) : (d.head ? esc(d.head) : '<span style="color:var(--warn)">Не назначен</span>'))+'</td>'+
        '<td>'+(d.hrbp ? esc(d.hrbp) : '<span style="color:var(--warn)">Не назначен</span>')+'</td>'+
        '<td><button class="btn-ghost" style="border:1px solid var(--line);min-height:32px;font-size:12px" onclick="openDivisionModal('+idx+')">'+ic('pencil')+'Назначить</button></td>'+
      '</tr>';
    }).join('')+
  '</table></div>';

  $('adminContent').innerHTML = h;
  $('divSearch').oninput = renderAdminDivisions;
}

function openDivisionModal(idx){
  var d = (S.adminDivs || [])[idx];
  if(!d) return;

  var el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = '<div class="sheet-in">'+
    '<div class="sheet-hd"><b>'+esc(d.unit)+'</b>'+
      '<button class="btn-ghost" data-x="1">Закрыть</button></div>'+
    '<label class="lbl" style="margin-top:4px">Направление</label>'+
    '<input id="dmDir" value="'+esc(d.dir)+'">'+
    '<label class="lbl">Руководитель отдела</label>'+
    '<input id="dmHead" value="'+esc(d.head)+'">'+
    '<label class="lbl">Ответственный за обзор</label>'+
    '<input id="dmResp" value="'+esc(d.resp)+'">'+
    '<label class="lbl">HR BP</label>'+
    '<input id="dmHrbp" value="'+esc(d.hrbp)+'">'+
    '<label class="lbl">Примечание</label>'+
    '<input id="dmNote" value="'+esc(d.note)+'">'+
    '<div style="height:16px"></div>'+
    '<button id="dmSave" class="btn-primary">Сохранить</button>'+
  '</div>';

  document.body.appendChild(el);

  el.addEventListener('click', function(e){
    if(e.target === el || e.target.dataset.x) el.remove();
  });

  el.querySelector('#dmSave').onclick = function(){
    var payload = {
      unit: d.unit,
      dir: el.querySelector('#dmDir').value.trim(),
      head: el.querySelector('#dmHead').value.trim(),
      resp: el.querySelector('#dmResp').value.trim(),
      hrbp: el.querySelector('#dmHrbp').value.trim(),
      note: el.querySelector('#dmNote').value.trim()
    };
    var btn = this;
    btn.disabled = true; btn.textContent = 'Сохраняем…';
    call('apiAdminSaveDivision', S.token, payload).then(function(res){
      btn.disabled = false; btn.textContent = 'Сохранить';
      if(res && res.ok){
        el.remove();
        toast('Подразделение обновлено');
        loadAdminDivisions();
      } else {
        toast((res && res.error) || 'Ошибка');
      }
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Сохранить';
      toast('Нет связи');
    });
  };
}

// ─── Вкладка: Период сбора ───
function renderAdminPeriod(){
  var p = S.data.period || {};
  var closed = p.state === 'закрыт';

  var h = '<div class="card" style="margin-bottom:16px">'+
    '<div style="font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:6px">Текущий период сбора</div>'+
    '<div style="font-weight:700;font-size:18px">'+esc(p.name || 'Обзор рынка')+'</div>'+
    '<div style="font-size:13.5px;color:var(--muted);margin-top:6px">'+
      'Статус: <b style="color:'+(closed?'var(--no)':'var(--ok)')+'">'+esc(p.state || 'открыт')+'</b>'+
      (p.from ? ' · с '+esc(p.from) : '') + (p.to ? ' · по '+esc(p.to) : '') +
      (p.by ? '<br>Изменил: <b>'+esc(p.by)+'</b>'+(p.at?' ('+esc(p.at)+')':'') : '') +
    '</div>'+
    '<div style="height:16px"></div>'+
    (closed
      ? '<button id="btnAdminPeriodOpen" class="btn-line" style="color:var(--ok);border-color:var(--ok);font-weight:700">Открыть новый период</button>'
      : '<button id="btnAdminPeriodClose" class="btn-line btn-danger">Закрыть период сбора</button>')+
  '</div>';

  $('adminContent').innerHTML = h;

  if($('btnAdminPeriodOpen')){
    $('btnAdminPeriodOpen').onclick = function(){
      askText({
        title: 'Открыть новый период сбора',
        html: 'Все сотрудники получат доступ к редактированию и внесению данных.',
        value: 'Обзор рынка — ' + new Date().toLocaleDateString('ru-RU', {month:'long', year:'numeric'}),
        ok: 'Открыть период'
      }).then(function(name){
        if(!name) return;
        call('apiSetPeriod', S.token, { state:'открыт', name:name }).then(function(res){
          if(res && res.ok){
            S.data.period = res.period;
            toast('Период открыт');
            renderAdminPeriod();
          } else {
            toast((res&&res.error)||'Ошибка');
          }
        });
      });
    };
  }

  if($('btnAdminPeriodClose')){
    $('btnAdminPeriodClose').onclick = function(){
      ask({
        title: 'Закрыть период сбора данных?',
        html: 'Руководители и сотрудники больше не смогут изменять данные (только просмотр).',
        ok: 'Закрыть период',
        danger: true
      }).then(function(yes){
        if(!yes) return;
        call('apiSetPeriod', S.token, { state:'закрыт' }).then(function(res){
          if(res && res.ok){
            S.data.period = res.period;
            toast('Период закрыт');
            renderAdminPeriod();
          } else {
            toast((res&&res.error)||'Ошибка');
          }
        });
      });
    };
  }
}

// ─── Вкладка: Сервис и Журнал ───
function renderAdminTools(){
  var h = '<div class="sec-title">Сервисные утилиты обслуживания</div>'+
    '<div class="kpi-grid" style="grid-template-columns:1fr;margin-bottom:20px">'+
      '<div class="card">'+
        '<div style="font-weight:700;font-size:15px">'+ic('broom',15)+'Нормализация сегментов и дублей компаний</div>'+
        '<div style="font-size:13px;color:var(--muted);margin:4px 0 10px">Сверяет лист «Конкуренты» со справочником компаний, удаляет скрытые пробелы, проставляет правильные сегменты и обновляет справочник.</div>'+
        '<button class="btn-line" onclick="runMaintenanceTool(\'clean_segments\', \'Нормализация сегментов\')">Запустить нормализацию</button>'+
      '</div>'+
      '<div class="card">'+
        '<div style="font-weight:700;font-size:15px">'+ic('link',15)+'Устранение расхождений в связях</div>'+
        '<div style="font-size:13px;color:var(--muted);margin:4px 0 10px">Находит и восстанавливает потерянные связи между подразделениями и конкурентами.</div>'+
        '<button class="btn-line" onclick="runMaintenanceTool(\'fix_links\', \'Починка связей\')">Устранить расхождения</button>'+
      '</div>'+
      '<div class="card">'+
        '<div style="font-weight:700;font-size:15px">'+ic('bolt',15)+'Полный пересчёт статусов заполнения</div>'+
        '<div style="font-size:13px;color:var(--muted);margin:4px 0 10px">Синхронизирует лист «Статус заполнения» по всем 326 подразделениям.</div>'+
        '<button class="btn-line" onclick="runMaintenanceTool(\'sync_status\', \'Пересчёт статусов\')">Пересчитать статусы</button>'+
      '</div>'+
    '</div>';

  h += '<div class="sec-title">Журнал последних действий (Audit Log)</div>'+
    '<div id="auditLogBox"><div class="sp"><i></i> Загрузка журнала…</div></div>';

  $('adminContent').innerHTML = h;

  call('apiAdminGetAuditLog', S.token, 60).then(function(r){
    if(!r || !r.ok){
      $('auditLogBox').innerHTML = '<div class="err">'+esc((r&&r.error)||'Не удалось загрузить журнал')+'</div>';
      return;
    }
    var logs = r.logs || [];
    if(!logs.length){
      $('auditLogBox').innerHTML = '<div class="empty">Журнал пуст</div>';
      return;
    }
    var logH = '<div class="tblwrap"><table class="co-tbl">'+
      '<tr><th>Время</th><th>Логин</th><th>Действие</th><th>Детали</th></tr>'+
      logs.map(function(l){
        return '<tr>'+
          '<td style="white-space:nowrap;font-size:12px;color:var(--muted)">'+esc(l.dt)+'</td>'+
          '<td><b>'+esc(l.login)+'</b></td>'+
          '<td>'+esc(l.action)+'</td>'+
          '<td style="font-size:12.5px;color:var(--muted)">'+esc(l.detail)+'</td>'+
        '</tr>';
      }).join('')+
      '</table></div>';
    $('auditLogBox').innerHTML = logH;
  });
}

function runMaintenanceTool(type, title){
  ask({
    title: 'Запустить процедуру: ' + title + '?',
    html: 'Операция выполнится на сервере Google Apps Script и зафиксируется в журнале.',
    ok: 'Запустить'
  }).then(function(yes){
    if(!yes) return;
    toast('Выполняется: ' + title + '…');
    call('apiAdminRunMaintenance', S.token, type).then(function(res){
      if(res && res.ok){
        ask({ title:'Готово', html: esc(res.message), ok:'Понятно' });
        renderAdminTools();
      } else {
        toast((res && res.error) || 'Ошибка выполнения');
      }
    }).catch(function(){
      toast('Нет связи');
    });
  });
}

// ═══════════════════════════════════════════════════════════
// СВОДКА ПО HR BP (быстрый вид)
// ═══════════════════════════════════════════════════════════
function openDash(){
  setTop('Сводка по подразделениям', userLabel(), true);
  $('bar').classList.add('hidden');
  $('body').onclick = null;
  $('body').innerHTML = '<div class="sp"><i></i> Считаем…</div>';
  call('apiDashboard', S.token).then(function(r){
    if(!r || !r.ok){ $('body').innerHTML = '<div class="err">'+esc((r&&r.error)||'Ошибка')+'</div>'; return; }
    if(r.period) S.data.period = r.period;
    var p = S.data.period || {};
    var closed = p.state === 'закрыт';

    var h = '<div class="card" style="margin-bottom:16px;max-width:520px">'+
      '<div style="font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;'+
        'letter-spacing:.6px;margin-bottom:6px">Период заполнения</div>'+
      '<div style="font-weight:600;font-size:16px">'+esc(p.name || 'без названия')+'</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-top:4px">'+
        'Состояние: <b style="color:'+(closed?'var(--no)':'var(--ok)')+'">'+esc(p.state||'открыт')+'</b>'+
        (p.from ? ' · с '+esc(p.from) : '') + (p.to ? ' · по '+esc(p.to) : '') +
        (p.by ? '<br>изменил: '+esc(p.by)+(p.at?' ('+esc(p.at)+')':'') : '') + '</div>'+
      '<div style="height:12px"></div>'+
      (closed
        ? '<button id="btnPeriod" class="btn-line" style="color:var(--ok);border-color:var(--ok)">Открыть новый период</button>'
        : '<button id="btnPeriod" class="btn-line btn-danger">Закрыть период заполнения</button>')+
      '</div>';

    var done = r.rows.filter(function(x){ return x.total && x.done === x.total; }).length;
    var svTotal = r.rows.reduce(function(s,x){ return s + (x.surveys||0); }, 0);
    var askTotal = r.rows.reduce(function(s,x){ return s + (x.ask||0); }, 0);
    h += '<div class="sec-title">Заполнено полностью: '+done+' из '+r.rows.length+
         ' · записей по должностям: '+svTotal+'</div>';
    if(askTotal){
      h += '<div class="note">На уточнении по всем подразделениям: <b>'+askTotal+'</b> компаний. '+
           'Они не входят в «проверено».</div>';
    }
    h += '<div class="search-wrap" style="max-width:420px;margin-bottom:14px">'+icBare('search')+
      '<input id="dashSumSearch" placeholder="Поиск по подразделению, ответственному, HR BP…"></div>';
    h += '<div id="dashSumTblBox"></div>';
    $('body').innerHTML = h;

    function drawTable(){
      var q = ($('dashSumSearch').value || '').trim().toLowerCase();
      var rows = !q ? r.rows : r.rows.filter(function(x){
        return (x.unit||'').toLowerCase().indexOf(q) >= 0 ||
               (x.resp||'').toLowerCase().indexOf(q) >= 0 ||
               (x.hrbp||'').toLowerCase().indexOf(q) >= 0 ||
               (x.dir||'').toLowerCase().indexOf(q) >= 0;
      });
      var t = '<div class="tblwrap"><table class="co-tbl">'+
        '<tr><th>Подразделение</th><th>Ответственный</th><th>Компании</th><th>Уточнить</th>'+
        '<th>Данные</th><th>Обновлено</th></tr>';
      t += rows.length ? rows.map(function(x){
        var pct = x.total ? Math.round(x.done/x.total*100) : 0;
        var cls = pct>=100 ? 'p-ok' : (pct>0 ? 'p-mid' : 'p-no');
        var scls = x.surveys>0 ? 'p-ok' : 'p-no';
        return '<tr class="dash-row" data-u="'+esc(x.unit)+'" style="cursor:pointer">'+
          '<td>'+esc(x.unit)+'</td><td>'+esc(x.resp)+'</td>'+
          '<td><span class="pill '+cls+'">'+x.done+'/'+x.total+'</span></td>'+
          '<td>'+((x.ask||0) ? '<span class="pill p-ask">'+x.ask+'</span>' : '—')+'</td>'+
          '<td><span class="pill '+scls+'">'+(x.surveys||0)+'</span></td>'+
          '<td style="font-size:12px;color:var(--muted)">'+esc(fmtDateTime(x.at)||'—')+'</td></tr>';
      }).join('') : '<tr><td colspan="6"><div class="empty">Ничего не найдено</div></td></tr>';
      t += '</table></div>';
      $('dashSumTblBox').innerHTML = t;

      $('dashSumTblBox').onclick = function(e){
        var tr = e.target.closest('tr[data-u]');
        if(!tr) return;
        openUnit(tr.dataset.u);
      };
    }
    drawTable();
    $('dashSumSearch').oninput = drawTable;

    $('btnPeriod').onclick = function(){
      var btn = this;
      if(closed){
        askText({
          title: 'Открыть новый период',
          html: 'Руководители снова смогут вносить и удалять данные.',
          value: 'Обзор рынка — ' +
            new Date().toLocaleDateString('ru-RU', {month:'long', year:'numeric'}),
          placeholder: 'Название периода',
          ok: 'Открыть период'
        }).then(function(name){
          if(name === null) return;
          btn.disabled = true; btn.textContent = 'Открываем…';
          call('apiSetPeriod', S.token, { state:'открыт', name:name })
            .then(afterPeriod).catch(periodFail);
        });
      } else {
        ask({
          title: 'Закрыть период заполнения?',
          html: 'Руководители перейдут в режим просмотра — вносить и удалять данные ' +
                'они больше не смогут.\nВы как HR BP сможете править и после закрытия.',
          ok: 'Закрыть период',
          danger: true
        }).then(function(yes){
          if(!yes) return;
          btn.disabled = true; btn.textContent = 'Закрываем…';
          call('apiSetPeriod', S.token, { state:'закрыт' }).then(afterPeriod).catch(periodFail);
        });
      }
    };
    function afterPeriod(res){
      if(!res || !res.ok){ toast((res&&res.error)||'Не удалось изменить период'); openDash(); return; }
      S.data.period = res.period;
      var isElevated = (S.data.user.role === 'admin' || S.data.user.role === 'cb');
      S.ro = !!(res.period.state === 'закрыт' && S.data.user.role !== 'hrbp' && !isElevated);
      toast('Период ' + res.period.state);
      openDash();
    }
    function periodFail(){ toast('Нет связи'); openDash(); }
  });
}
</script>
