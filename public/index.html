  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" style="vertical-align:-2.5px;margin-right:5px;flex:none">'+(ICONS[name]||'')+'</svg>';

/** Голая иконка без отступов — для абсолютного позиционирования (.search-wrap и т.п.). */

  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none">'+(ICONS[name]||'')+'</svg>';
}
/** Дата входа приходит с сервера сырым ISO-таймстампом — приводим к «ДД.ММ.ГГГГ ЧЧ:ММ». */
function fmtDateTime(s){
  if(!s || !/^\d{4}-\d{2}-\d{2}T/.test(s)) return s;
  var d = new Date(s);
  if(isNaN(d.getTime())) return s;
  return d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}

function fetchJson(url, opts){
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if(opts.token) headers['Authorization'] = 'Bearer ' + opts.token;
  var conf = {
    method: opts.method || 'GET',
    headers: headers
  };
  if(opts.body && (conf.method === 'POST' || conf.method === 'PUT')) {
    conf.body = JSON.stringify(opts.body);
  }
  return fetch(url, conf).then(function(res){
    return res.json().catch(function(){ return { ok: false, error: 'Ошибка ответа сервера' }; });
  });
}

function call(fn){
  var args = [].slice.call(arguments, 1);
  if(API_ROUTES[fn]) return API_ROUTES[fn](args);
  return Promise.reject(new Error('Неизвестный метод: ' + fn));
}

var toastTimer;
function toast(msg){
  var t = document.querySelector('.toast');
  if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove(); }, 2800);
}

/**
 * Внутреннее окно подтверждения вместо confirm().
 * Браузерное показывает домен googleusercontent.com и читается как
 * предупреждение чужого сайта — половина людей на нём останавливается.
 * Возвращает промис: true — согласились, false — отменили.
 *
 * opts = { title, html, ok, cancel, danger }
 */
function ask(opts){
  return new Promise(function(resolve){
    var el = document.createElement('div');
    el.className = 'sheet';
    el.innerHTML = '<div class="sheet-in dlg">'+
      '<b class="dlg-t">'+esc(opts.title || 'Подтвердите')+'</b>'+
      '<p class="dlg-x">'+(opts.html || '')+'</p>'+
      '<div class="dlg-a">'+
        '<button type="button" data-v="0">'+esc(opts.cancel || 'Отмена')+'</button>'+
        '<button type="button" data-v="1" class="dlg-go '+
          (opts.danger ? 'btn-danger' : 'btn-primary')+'">'+
          esc(opts.ok || 'Продолжить')+'</button>'+
      '</div></div>';
    document.body.appendChild(el);

    var done = function(v){
      if(!el.parentNode) return;
      document.removeEventListener('keydown', onKey, true);
      el.remove();
      resolve(v);
    };
    var onKey = function(e){
      if(e.key === 'Escape'){ e.preventDefault(); done(false); }
      else if(e.key === 'Enter'){ e.preventDefault(); done(true); }
    };
    document.addEventListener('keydown', onKey, true);
    el.addEventListener('click', function(e){
      if(e.target === el){ done(false); return; }
      var b = e.target.closest('button[data-v]');
      if(b) done(b.dataset.v === '1');
    });
    // на телефоне фокус не ставим: он вызывает подсветку и подпрыгивание экрана
    if(window.innerWidth >= 640){
      setTimeout(function(){ try{ el.querySelector('.dlg-go').focus(); }catch(e){} }, 40);
    }
  });
}

/**
 * То же вместо prompt(). Возвращает строку либо null, если отменили.
 * opts = { title, html, value, placeholder, ok }
 */
function askText(opts){
  return new Promise(function(resolve){
    var el = document.createElement('div');
    el.className = 'sheet';
    el.innerHTML = '<div class="sheet-in dlg">'+
      '<b class="dlg-t">'+esc(opts.title || '')+'</b>'+
      (opts.html ? '<p class="dlg-x">'+opts.html+'</p>' : '<div style="height:12px"></div>')+
      '<input class="dlg-in" id="dlgIn" value="'+esc(opts.value || '')+'" '+
        'placeholder="'+esc(opts.placeholder || '')+'">'+
      '<div class="dlg-a">'+
        '<button type="button" data-v="0">Отмена</button>'+
        '<button type="button" data-v="1" class="btn-primary">'+esc(opts.ok || 'Готово')+'</button>'+
      '</div></div>';
    document.body.appendChild(el);

    var inp = el.querySelector('#dlgIn');
    var done = function(v){
      if(!el.parentNode) return;
      document.removeEventListener('keydown', onKey, true);
      el.remove();
      resolve(v);
    };
    var onKey = function(e){
      if(e.key === 'Escape'){ e.preventDefault(); done(null); }
      else if(e.key === 'Enter'){ e.preventDefault(); done(inp.value.trim()); }
    };
    document.addEventListener('keydown', onKey, true);
    el.addEventListener('click', function(e){
      if(e.target === el){ done(null); return; }
      var b = e.target.closest('button[data-v]');
      if(b) done(b.dataset.v === '1' ? inp.value.trim() : null);
    });
    setTimeout(function(){ try{ inp.focus(); inp.select(); }catch(e){} }, 60);
  });
}

/** Короткая обёртка: «есть несохранённые правки — продолжить?». */
function askDirty(action){
  return ask({
    title: 'Есть несохранённые правки',
    html: 'Изменения по этому подразделению ещё не отправлены в таблицу. ' +
          'Если продолжить, они пропадут.',
    ok: action,
    cancel: 'Остаться',
    danger: true
  });
}

function show(scr){
  $('scrLogin').classList.toggle('hidden', scr!=='login');
  $('scrLoad').classList.toggle('hidden', scr!=='load');
  $('app').classList.toggle('hidden', scr!=='app');
}

/**
 * Набор кнопок-переключателей.
 * multi=true — можно выбрать несколько; req=true — снять выбор нельзя (обязательное поле).
 */
function chips(act, list, value, multi, req){
  var sel = multi ? (value||[]) : [value];
  return '<div class="chips" data-chips="'+act+'"'+(multi?' data-multi="1"':'')+
         (req?' data-req="1"':'')+'>' +
    list.map(function(v){
      var on = sel.indexOf(v) >= 0;
      return '<button type="button" data-act="'+act+'" data-v="'+esc(v)+'"'+(on?' class="on"':'')+'>'+esc(v)+'</button>';
    }).join('') + '</div>';
}

/** Поле, которое открывает экран выбора из справочника. */
function pickField(id, value, placeholder, need){
  return '<button type="button" class="pick'+(need&&!value?' need':'')+'" id="'+id+'">'+
    '<span class="'+(value?'':'ph')+'">'+esc(value || placeholder)+'</span><i>выбрать ▾</i></button>';
}

/**
 * Экран выбора значения из справочника: поиск + строгий список.
 * Свободного ввода нет — иначе одна и та же должность попадает в таблицу
 * в пяти написаниях. Если нужного значения нет, его добавляют кнопкой внизу,
 * и оно сразу появляется у всех остальных.
 *
 * opts = { title, block, list, value, placeholder, onPick,
 *          wide: [полный список], wideLabel, addUnit }
 * wide — второй список «по всему холдингу». Нужен должностям: у руководителя
 * показывается штатка его подразделения, но иногда должность лежит шире.
 */
function openPicker(opts){
  var el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = '<div class="sheet-in">'+
    '<div class="sheet-hd"><b>'+esc(opts.title)+'</b>'+
      '<button class="btn-ghost" data-x="1">Закрыть</button></div>'+
    '<div class="pk-search">'+
      '<input id="pkQ" placeholder="Поиск…" autocomplete="off" autocapitalize="off" '+
        'autocorrect="off" spellcheck="false"></div>'+
    '<div id="pkBody"></div>'+
    '<div style="height:10px"></div></div>';
  document.body.appendChild(el);

  var q = el.querySelector('#pkQ');
  var body = el.querySelector('#pkBody');
  var wideOn = false;                      // показан ли полный список холдинга

  function current(){ return (wideOn ? opts.wide : opts.list) || []; }

  function draw(){
    var s = q.value.trim().toLowerCase();
    var src = current();
    var list = src.filter(function(v){
      return !s || String(v).toLowerCase().indexOf(s) >= 0;
    });
    var exact = src.some(function(v){ return String(v).toLowerCase() === s; });

    var h = '';
    if(list.length){
      h += '<div class="pk-list">'+ list.slice(0,300).map(function(v){
        return '<button type="button" data-v="'+esc(v)+'"'+
          (v===opts.value?' class="on"':'')+'>'+esc(v)+'</button>';
      }).join('') +'</div>';
      if(list.length > 300) h += '<div class="pk-empty">Показаны первые 300 — уточните поиск</div>';
    } else {
      h += '<div class="pk-empty">'+
        (s ? 'Совпадений нет'
           : (wideOn ? 'Справочник пока пуст'
                     : 'Для вашего подразделения должности ещё не заведены')) +'</div>';
    }

    // Переключатель на полный список холдинга
    if(opts.wide && opts.wide.length){
      h += '<div class="pk-add"><button type="button" class="btn-line" id="pkWide">'+
        (wideOn ? '← Только должности моего подразделения'
                : (opts.wideLabel || 'Показать все должности холдинга')+
                  ' ('+opts.wide.length+')')+'</button></div>';
    }

    // Нет точного совпадения — предлагаем добавить своё значение
    if((opts.block || opts.addUnit) && s.length >= 2 && !exact){
      h += '<div class="pk-add"><button type="button" class="btn-line" id="pkAdd" '+
        'style="color:var(--accent);border-color:var(--accent)">'+
        '+ Добавить: <b>'+esc(q.value.trim())+'</b></button>'+
        '<p style="font-size:12.5px;color:var(--muted);margin:8px 2px 0">'+
        (opts.addUnit
          ? 'Должность добавится в штатку подразделения «'+esc(opts.addUnit)+'».'
          : 'Значение попадёт в «Справочник» и станет доступно всем.')+'</p></div>';
    }
    body.innerHTML = h;
  }
  draw();
  q.oninput = draw;

  function done(v){ el.remove(); opts.onPick(v); }

  el.addEventListener('click', function(e){
    if(e.target === el || e.target.dataset.x){ el.remove(); return; }

    if(e.target.closest('#pkWide')){
      wideOn = !wideOn;
      draw();
      return;
    }

    var add = e.target.closest('#pkAdd');
    if(add){
      var name = q.value.trim();
      add.disabled = true; add.textContent = 'Добавляем…';

      var req = opts.addUnit
        ? call('apiAddPosition', S.token, opts.addUnit, name)
        : call('apiAddRefValue', S.token, opts.block, name);

      req.then(function(r){
        if(!r || !r.ok){
          add.disabled = false;
          toast((r && r.error) || 'Не удалось добавить');
          draw();
          return;
        }
        // Обновляем списки у себя, чтобы не перезагружать всю форму
        if(opts.addUnit){
          S.data.positions = r.list;
          S.data.positionsAll = r.all;
          // штатка текущего подразделения тоже пополняется — иначе новая должность
          // не появится в чек-листе шага 2 до перезагрузки формы
          if(S.data.positionsByUnit && S.unit){
            var pu = S.data.positionsByUnit[S.unit] || (S.data.positionsByUnit[S.unit] = []);
            if(pu.indexOf(r.name) === -1) pu.push(r.name);
          }
          opts.list = r.list;
          opts.wide = r.all;
        } else {
          if(opts.block === 'segments') S.data.segments = r.list;
          if(opts.block === 'regions') S.data.regions = r.list;
          opts.list = r.list;
        }
        toast('Добавлено в справочник');
        done(r.name);
      }).catch(function(){
        add.disabled = false;
        toast('Нет связи с сервером');
        draw();
      });
      return;
    }

    var b = e.target.closest('.pk-list button[data-v]');
    if(b) done(b.dataset.v);
  });

  // На телефоне клавиатура закрывает половину экрана — фокус даём не сразу,
  // чтобы человек сначала увидел список целиком
  if((opts.list || []).length > 12){
    setTimeout(function(){ try{ q.focus(); }catch(e){} }, 120);
  }
}

/**
 * Экран входа. Ссылку на форму и доступ человек получает в боте,
 * поэтому здесь только логин и пароль — без кнопки «получить доступ».
 */
(function loginScreen(){
  $('loginHelp').innerHTML =
    '<p style="text-align:center;color:var(--muted);font-size:13px;margin-top:16px">'+
    'Логин и пароль присылает бот. Не приходил — обратитесь к своему HR BP.</p>';
})();

(function start(){
  var t = store.get(LS_TOKEN);
  if(!t){
    show('login');
    try{ $('inLogin').focus(); }catch(e){}
    return;
  }
  show('load');
  call('apiResume', t).then(function(r){
    if(r && r.ok){ S.token = r.token; onLoaded(r.data); }
    else { store.del(LS_TOKEN); show('login'); }
  }).catch(function(){ store.del(LS_TOKEN); show('login'); });
})();

$('btnLogin').onclick = doLogin;
$('inPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
$('inLogin').addEventListener('keydown', function(e){ if(e.key==='Enter') $('inPass').focus(); });

function doLogin(){
  var l = $('inLogin').value.trim(), p = $('inPass').value;
  if(!l || !p){ loginErr('Введите логин и пароль'); return; }
  $('btnLogin').disabled = true; $('btnLogin').textContent = 'Проверяем…';
  call('apiLogin', l, p).then(function(r){
    $('btnLogin').disabled = false; $('btnLogin').textContent = 'Войти';
    if(!r || !r.ok){ loginErr((r&&r.error)||'Ошибка входа'); return; }
    S.token = r.token;
    store.set(LS_TOKEN, r.token);
    $('inPass').value = '';
    onLoaded(r.data);
  }).catch(function(){
    $('btnLogin').disabled = false; $('btnLogin').textContent = 'Войти';
    loginErr('Нет связи с сервером. Проверьте интернет.');
  });
}
function loginErr(m){ var e=$('loginErr'); e.textContent=m; e.classList.remove('hidden'); }

function doLogout(){
  var go = function(){ store.del(LS_TOKEN); location.reload(); };
  if(!S.dirty){ go(); return; }
  askDirty('Выйти без сохранения').then(function(yes){ if(yes) go(); });
}

function doRefresh(){
  if(!S.dirty){ doRefresh_(); return; }
  askDirty('Перечитать из таблицы').then(function(yes){ if(yes) doRefresh_(); });
}

function doRefresh_(){
  toast('Обновляем…');
  call('apiRefresh', S.token).then(function(r){
    if(!r || !r.ok){ toast((r&&r.error)||'Не удалось обновить'); return; }
    S.dirty = false;
    onLoaded(r.data);
    toast('Данные перечитаны из таблицы');
  }).catch(function(){ toast('Нет связи'); });
}

/**
 * Меню в шапке. Раньше было полноэкранным оверлеем (.sheet) — по просьбе
 * пользователя переделано в панель, закреплённую у шапки справа, с
 * закрытием по X. Действует одинаково на мобильном и десктопе.
 */
$('btnMenu').onclick = function(){
  var r = S.data && S.data.user && S.data.user.role;
  var isElevated = (r === 'admin' || r === 'cb');
  var items = [];
  if(r === 'admin' || r === 'cb' || r === 'hrbp' || r === 'dir_head') {
    items.push(['dash_analytics', 'dashboard', 'Аналитический дашборд']);
  }
  if(r === 'admin' || r === 'cb') {
    items.push(['admin_panel', 'admin', 'Панель администратора']);
  }
  if(r === 'hrbp') {
    items.push(['dash_hrbp', 'clipboard', 'Сводка по HR BP']);
  }
  if(isElevated){
    items.push(['dash_hrbp', 'clipboard', 'Отчёт по подразделениям']);
  } else {
    items.push(['units_view', 'units', 'Мои подразделения']);
  }
  items.push(['refresh', 'refresh', 'Обновить данные из таблицы']);
  items.push(['help', 'help', 'Как заполнять']);
  items.push(['profile', 'profile', 'Профиль']);
  items.push(['out', 'logout', 'Выйти']);

  var el = document.createElement('div');
  el.className = 'menu-scrim';
  el.innerHTML = '<div class="menu-pop">'+
    '<div class="menu-pop-hd"><b>'+esc(userLabel())+'</b>'+
      '<button class="menu-x" data-x="1" aria-label="Закрыть">'+icBare('close',16)+'</button></div>'+
    '<div class="menu">'+ items.map(function(it){
      return '<button data-go="'+it[0]+'"'+(it[0]==='out'?' class="btn-danger"':'')+'>'+ic(it[1])+esc(it[2])+'</button>';
    }).join('') +'</div></div>';
  document.body.appendChild(el);

  el.addEventListener('click', function(e){
    if(e.target === el || e.target.closest('[data-x]')){ el.remove(); return; }
    var b = e.target.closest('button[data-go]');
    if(!b) return;
    el.remove();
    var g = b.dataset.go;
    if(g === 'dash_analytics') switchView('dashboard');
    else if(g === 'admin_panel') switchView('admin');
    else if(g === 'dash_hrbp') openDash();
    else if(g === 'units_view') switchView('units');
    else if(g === 'refresh') doRefresh();
    else if(g === 'help') openHelp();
    else if(g === 'profile') openProfile();
    else if(g === 'out') doLogout();
  });
};

/**
 * Боковая навигация на десктопе (см. .rail в style.css, видна от 1024px).
 * На мобильном экрана этот блок просто не отображается CSS-ом — вызывать
 * его лишний раз безвредно. Пункты те же, что в topNav/меню ⋮, чтобы
 * не разъезжались правила видимости по роли в трёх разных местах.
 */
function renderRail(){
  var rail = $('rail');
  if(!rail || !S.data) return;
  var r = S.data.user.role;

  // Admin/CB не заполняют анкеты сами — вместо «Мои подразделения» им
  // нужен отчёт по всем подразделениям (та же сводка, что видит HR BP,
  // серверная роль это уже разрешает — см. src/routes/api.js).
  var isElevated = (r === 'admin' || r === 'cb');

  var items = [];
  if(isElevated){
    items.push({ id:'report', view:null, label:'Отчёт по подразделениям', icon: ICONS.clipboard });
  } else {
    items.push({ id:'units', view:'units', label:'Подразделения', icon: ICONS.units });
  }
  if(r === 'admin' || r === 'cb' || r === 'hrbp' || r === 'dir_head'){
    items.push({ id:'dashboard', view:'dashboard', label:'Дашборд', icon: ICONS.dashboard });
  }
  if(r === 'admin' || r === 'cb'){
    items.push({ id:'admin', view:'admin', label:'Админка', icon: ICONS.admin });
  }
  if(r === 'hrbp'){
    items.push({ id:'hrbp_summary', view:null, label:'Сводка по HR BP', icon: ICONS.clipboard });
  }

  $('railNav').innerHTML = items.map(function(it){
    var on = (S.appView === it.view && S.unit === null) ? ' on' : '';
    return '<button class="rail-item'+on+'" data-rail="'+it.id+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none">'+it.icon+'</svg>'+esc(it.label)+'</button>';
  }).join('');

  $('railNav').onclick = function(e){
    var b = e.target.closest('button[data-rail]');
    if(!b) return;
    var it = items.filter(function(x){ return x.id === b.dataset.rail; })[0];
    if(!it) return;
    if(it.id === 'hrbp_summary' || it.id === 'report'){ openDash(); return; }
    if(it.view === S.appView && S.unit === null) return;
    if(S.dirty){
      askDirty('Переключить раздел').then(function(yes){
        if(yes){ S.dirty = false; switchView(it.view); }
      });
    } else {
      switchView(it.view);
    }
  };

  var fio = userLabel();
  $('railAv').textContent = fio.trim().slice(0,1).toUpperCase() || '?';
  $('railFio').textContent = fio;
  var roleNames = { admin:'Администратор', cb:'C&B Аналитик', hrbp:'HR BP', dir_head:'Руководитель направления', head:'Руководитель отдела', user:'Сотрудник' };
  $('railRole').textContent = roleNames[r] || r;
}

function renderTopNav(){
  renderRail();
  var r = S.data && S.data.user && S.data.user.role;
  var isSpecial = (r === 'admin' || r === 'cb' || r === 'hrbp' || r === 'dir_head');
  var topNav = $('topNav');
  if(!isSpecial || S.unit !== null){
    topNav.classList.add('hidden');
    return;
  }
  topNav.classList.remove('hidden');
  var btns = [];
  if(r !== 'admin' && r !== 'cb'){
    btns.push({ id:'units', icon:'units', label:'Подразделения' });
  }
  btns.push({ id:'dashboard', icon:'dashboard', label:'Дашборд' });
  if(r === 'admin' || r === 'cb'){
    btns.push({ id:'admin', icon:'admin', label:'Админка' });
  }

  topNav.innerHTML = btns.map(function(b){
    var on = S.appView === b.id ? ' on' : '';
    return '<button class="nav-btn'+on+'" data-view="'+b.id+'">'+ic(b.icon)+esc(b.label)+'</button>';
  }).join('');

  topNav.onclick = function(e){
    var b = e.target.closest('button[data-view]');
    if(!b) return;
    var v = b.dataset.view;
    if(v === S.appView && S.unit === null) return;
    if(S.dirty){
      askDirty('Переключить раздел').then(function(yes){
        if(yes){ S.dirty = false; switchView(v); }
      });
    } else {
      switchView(v);
    }
  };
}

function switchView(v){
  S.appView = v;
  S.unit = null;
  renderTopNav();
  if(v === 'units') renderUnits();
  else if(v === 'dashboard') openDashboard();
  else if(v === 'admin') openAdminPanel();
}

    '<div class="profile-card">'+
      '<div class="profile-av">'+esc(fio.trim().slice(0,1).toUpperCase() || '?')+'</div>'+
      '<div><div class="profile-fio">'+esc(fio)+'</div>'+

}

/** Смена собственного пароля. */
function openPassword(){
  var el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = '<div class="sheet-in">'+
    '<div class="sheet-hd"><b>Сменить пароль</b>'+
      '<button class="btn-ghost" data-x="1">Закрыть</button></div>'+
    '<div id="pwErr" class="err hidden"></div>'+
    '<label class="lbl" style="margin-top:6px">Текущий пароль</label>'+
    '<input id="pwOld" type="password" autocomplete="current-password">'+
    '<label class="lbl">Новый пароль</label>'+
    '<input id="pwNew" type="password" autocomplete="new-password" placeholder="минимум 6 символов">'+
    '<label class="lbl">Повторите новый</label>'+
    '<input id="pwNew2" type="password" autocomplete="new-password">'+
    '<div style="height:16px"></div>'+
    '<button id="pwGo" class="btn-primary">Сменить пароль</button>'+
    '<p style="font-size:13px;color:var(--muted);margin:14px 0 0;text-align:center">'+
      'Запишите новый пароль — восстановить его нельзя,<br>только выдать новый через HR BP.</p>'+
    '</div>';
  document.body.appendChild(el);

  var err = function(m){
    var e = el.querySelector('#pwErr');
    e.textContent = m; e.classList.remove('hidden');
  };

  el.addEventListener('click', function(e){
    if(e.target === el || e.target.dataset.x) el.remove();
  });

  el.querySelector('#pwGo').onclick = function(){
    var o = el.querySelector('#pwOld').value;
    var n = el.querySelector('#pwNew').value;
    var n2 = el.querySelector('#pwNew2').value;
    if(!o || !n){ err('Заполните все поля'); return; }
    if(n.length < 6){ err('Новый пароль — минимум 6 символов'); return; }
    if(n !== n2){ err('Новые пароли не совпадают'); return; }

    var btn = this;
    btn.disabled = true; btn.textContent = 'Меняем…';
    call('apiChangePassword', S.token, o, n).then(function(r){
      btn.disabled = false; btn.textContent = 'Сменить пароль';
      if(!r || !r.ok){ err((r && r.error) || 'Не удалось сменить пароль'); return; }
      el.remove();
      toast('Пароль изменён. В следующий раз входите с новым.');
    }).catch(function(){
      btn.disabled = false; btn.textContent = 'Сменить пароль';
      err('Нет связи с сервером');
    });
  };

  setTimeout(function(){ el.querySelector('#pwOld').focus(); }, 60);
}

function onLoaded(data){
  S.data = data;
  var isElevated = (data.user.role === 'admin' || data.user.role === 'cb');
  S.ro = !!(data.period && data.period.state === 'закрыт' && data.user.role !== 'hrbp' && !isElevated);
  // Admin/CB не заполняют анкеты сами, поэтому у них нет экрана «Мои
  // подразделения» — на нём они увидели бы только «не назначены».
  // Дефолт при первом входе — дашборд; как только пользователь сам
  // переключится на другой раздел, S.appView уже не 'units', и это
  // условие больше не сработает в текущей сессии.
  if(isElevated && S.appView === 'units') S.appView = 'dashboard';

function renderUnitCards(list){
  if(!list.length) return '<div class="empty">Подразделения не найдены</div>';
  return list.map(function(x){
    var pct = x.total ? Math.round(x.done/x.total*100) : 0;
    var askPct = x.total ? Math.round((x.ask||0)/x.total*100) : 0;
    return '<div class="unit" data-u="'+esc(x.unit)+'">'+ring(pct, askPct)+
      '<div class="u-body"><div class="u-name">'+esc(x.unit)+'</div>'+
      '<div class="u-dir">'+esc(x.dir)+' · '+x.done+' из '+x.total+
      ' · данных: '+(x.surveys||0)+'</div>'+
      ((x.ask||0) ? '<div class="u-ask">'+ic('warn')+'требует уточнения: '+x.ask+'</div>' : '')+
      '</div>'+
      '<div class="u-chev">›</div></div>';
  }).join('');
}

/**
 * Кольцо прогресса: зелёная дуга — проверено, жёлтая — «уточнить».
 * «Уточнить» намеренно не входит в процент: вопрос ещё не закрыт.
 */
function ring(pct, askPct){
  var r = 19, c = 2*Math.PI*r;
  var donePart = c * (pct/100);
  var askPart = c * ((askPct||0)/100);
  var col = pct>=100 ? 'var(--ok)' : (pct>0 ? 'var(--warn)' : 'var(--line)');
  var h = '<div class="ring"><svg width="46" height="46">'+
    '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="4"/>';
  if(askPart > 0){
    // жёлтую дугу рисуем сразу за зелёной
    h += '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="var(--warn)" stroke-width="4"'+
      ' stroke-dasharray="'+askPart.toFixed(1)+' '+(c-askPart).toFixed(1)+'"'+
      ' stroke-dashoffset="'+(-donePart).toFixed(1)+'"/>';
  }
  if(donePart > 0){
    h += '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="4"'+
      ' stroke-dasharray="'+donePart.toFixed(1)+' '+(c-donePart).toFixed(1)+'"'+
      ' stroke-dashoffset="0" stroke-linecap="round"/>';
  }
  return h + '</svg><b>'+pct+'%</b></div>';
}

}

// ЭКРАН: подразделение (две вкладки)
// ═══════════════════════════════════════════════════════════
function openUnit(unit){
  S.unit = unit;
  S.tab = 'comp';
  S.rows = S.data.rows.filter(function(r){ return r.unit === unit; })
                      .map(function(r){ return JSON.parse(JSON.stringify(r)); });
  S.surveys = S.data.surveys.filter(function(r){ return r.unit === unit; })
                            .map(function(r){ return JSON.parse(JSON.stringify(r)); });
  S.added = []; S.removed = []; S.note = ''; S.dirty = false;

  var d = null;
  if(!S.ro){
    try{ d = JSON.parse(store.get(LS_DRAFT+unit) || 'null'); }catch(e){ d = null; }
  }
  if(!d){ renderUnit(); return; }

  ask({
    title: 'Найден черновик',
    html: 'По подразделению <b>'+esc(unit)+'</b> остались правки, которые не были ' +
          'отправлены в таблицу — например, вкладку закрыли до сохранения.',
    ok: 'Восстановить',
    cancel: 'Начать заново'
  }).then(function(yes){
    if(yes){
      S.rows = d.rows || S.rows; S.added = d.added || [];
      S.surveys = d.surveys || S.surveys; S.removed = d.removed || [];
      S.note = d.note || ''; S.dirty = true;
    } else {
      store.del(LS_DRAFT+unit);
    }
    renderUnit();
  });
}

/** Сколько компаний проверено, сколько отложено на уточнение. */
function counts(){
  var all = S.rows.length + S.added.length;
  var done = 0, ask = 0;
  S.rows.forEach(function(r){
    if(r.actual === 'уточнить') ask++;
    else if(r.actual && r.actual !== 'не проверено') done++;
  });
  S.added.forEach(function(r){
    if(r.actual === 'уточнить') ask++;
    else if(r.actual && r.actual !== 'не проверено') done++;
  });
  return { all: all, done: done, ask: ask, left: all - done - ask };
}

function renderUnit(){
  setTop(S.unit, '', true);
  $('body').onclick = null;

  var c = counts();
  var step1done = c.all > 0 && c.done === c.all;

  var cls = function(tab, done){
    return (S.tab===tab ? 'on' : '') + (done ? ' done' : '');
  };

  var h = periodBanner();
  h += '<div class="tabs">'+
    '<button data-tab="comp" class="'+cls('comp', step1done)+'">'+
      '<small>Шаг 1</small>Конкуренты · '+c.done+'/'+c.all+
      (c.ask ? ' <span style="color:var(--warn)">?'+c.ask+'</span>' : '')+'</button>'+
    '<button data-tab="survey" class="'+cls('survey', S.surveys.length>0)+'">'+
      '<small>Шаг 2</small>Данные по рынку · '+svLabel()+'</button>'+
    '</div>';
  h += '<p class="step-hint">'+ (S.tab==='comp'
      ? 'Отметьте по каждой компании, конкурент она вам или нет. Не уверены — «Уточнить»: такие останутся в работе.'
      : 'Внесите оклады, бонусы и льготы по должностям, которые знаете. Неполные данные тоже нужны.'
    ) +'</p>';
  h += '<div id="tabBody"></div>';
  $('body').innerHTML = h;

  $('body').querySelector('.tabs').onclick = function(e){
    var b = e.target.closest('button[data-tab]');
    if(!b || b.dataset.tab === S.tab) return;
    S.tab = b.dataset.tab;
    renderUnit();
  };

  if(S.tab === 'comp') renderTabComp();
  else renderTabSurvey();

  $('bar').classList.remove('hidden');
  updateProgress();
}

// ─────────── Вкладка 1: конкуренты ───────────
function renderTabComp(){
  var c = counts();
  var h = '';

  // Отложенные на уточнение показываем отдельно — иначе они теряются в общем списке
  if(c.ask){
    h += '<div class="note">Требует уточнения: <b>'+c.ask+'</b>. '+
      'Эти компании не считаются проверенными — вернитесь к ним, когда выясните.</div>';

       '<div class="empty">Список пуст</div>';

  if(S.added.length){
    h += '<div class="sec-title">Добавленные, ещё не сохранены</div><div id="adds" class="row-grid">';
    h += S.added.map(function(r,i){ return rowCard(r, i, true); }).join('');

  } else { h += '<div id="adds" class="row-grid"></div>'; }

  h += '<label class="lbl" style="margin-top:22px">Комментарий по подразделению</label>';
  h += '<textarea id="unitNote" placeholder="Что важно знать о рынке труда вашего подразделения"'+
       (S.ro?' disabled':'')+'>'+esc(S.note)+'</textarea>';

  if(!S.ro){
    h += '<div class="next-step">';
    h += '<p>'+ (c.left
        ? 'Осталось отметить компаний: '+c.left+
          (c.ask ? ', плюс '+c.ask+' на уточнении' : '')+
          '. Можно перейти к шагу 2 и вернуться позже.'
        : (c.ask
            ? 'Все компании отмечены, но '+c.ask+' ждут уточнения. Дальше — зарплаты и льготы.'

  if($('btnNext')) $('btnNext').onclick = function(){ S.tab = 'survey'; renderUnit(); };
  if($('btnSubmit')) $('btnSubmit').onclick = function(){ save(true); };
}

function rowCard(r, i, isNew){
  var st = r.actual === 'актуально' ? 'st-yes'
         : r.actual === 'не актуально' ? 'st-no'
         : r.actual === 'уточнить' ? 'st-ask' : '';
  var meta = [r.seg, r.region].filter(String).join(' · ');
  var name = r.company || '(название не заполнено в таблице)';
  var h = '<div class="row '+st+'" data-i="'+i+'">';
  h += '<div class="row-head"><div class="row-name"'+
       (r.company?'':' style="color:var(--muted);font-weight:400;font-style:italic"')+'>'+
       esc(name)+(isNew?' <span class="pill p-ok">новая</span>':'')+'</div>';
  if(meta) h += '<div class="row-meta">'+esc(meta)+'</div>';
  if(r.actual === 'уточнить') h += '<div class="row-ask">'+ic('warn')+'требует уточнения</div>';
  if(r.note) h += '<div class="row-note-preview">'+esc(r.note)+'</div>';
  h += '</div>';

  h += '<div class="seg">'+
    [['актуально','✓ Актуально'],['не актуально','✕ Не актуально'],['уточнить','? Уточнить']].map(function(pair){
      var v = pair[0], lbl = pair[1];
      return '<button data-act="actual" data-v="'+v+'"'+(r.actual===v?' class="on"':'')+
        (S.ro?' disabled':'')+'>'+lbl+'</button>';
    }).join('')+'</div>';

  h += '<button class="toggle-more" data-act="more">Подробнее ▾</button>';
  h += '<div class="more hidden">';
  h += '<div style="font-size:12px;color:var(--muted);margin:8px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Тип конкурента</div>';
  h += chips('type', S.data.ref.types, r.type, false);
  h += '<div style="font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Приоритет</div>';
  h += chips('prio', S.data.ref.priorities, r.prio, false);
  h += '<label class="lbl">Комментарий'+
       (r.actual === 'уточнить' ? ' — что именно уточнить' : '')+'</label>';
  h += '<textarea data-act="note" placeholder="'+
       (r.actual === 'уточнить' ? 'Что нужно выяснить и у кого' : 'Почему важен / что учесть')+
       '"'+(S.ro?' disabled':'')+'>'+esc(r.note||'')+'</textarea>';
  h += '</div></div>';
  return h;
}

function bindRows(){
  ['rows','adds'].forEach(function(zone){
    var box = $(zone);
    if(!box) return;
    box.addEventListener('click', function(e){
      var b = e.target.closest('button');
      if(!b) return;
      var card = b.closest('.row');
      var arr = zone === 'rows' ? S.rows : S.added;
      var r = arr[+card.dataset.i];
      var act = b.dataset.act;

      if(act === 'more'){
        var m = card.querySelector('.more');
        var closed = m.classList.toggle('hidden');
        b.textContent = closed ? 'Подробнее ▾' : 'Свернуть ▴';
        return;
      }
      if(S.ro) return;
      if(act === 'actual'){
        r.actual = (r.actual === b.dataset.v) ? 'не проверено' : b.dataset.v;
        card.className = 'row ' + (r.actual==='актуально'?'st-yes':r.actual==='не актуально'?'st-no':
                                   r.actual==='уточнить'?'st-ask':'');
        card.querySelectorAll('.seg button').forEach(function(x){
          x.classList.toggle('on', x.dataset.v === r.actual); });
        // подпись «не считается проверенной» появляется и исчезает сразу
        var head = card.querySelector('.row-head');
        var mark = head.querySelector('.row-ask');
        if(r.actual === 'уточнить' && !mark){
          var d = document.createElement('div');
          d.className = 'row-ask';
          d.textContent = 'не считается проверенной';
          var prev = head.querySelector('.row-note-preview');
          if(prev) head.insertBefore(d, prev); else head.appendChild(d);
        } else if(r.actual !== 'уточнить' && mark){ mark.remove(); }
        markDirty(); updateProgress(); return;
      }
      if(act === 'type' || act === 'prio'){
        r[act] = (r[act] === b.dataset.v) ? '' : b.dataset.v;
        b.parentNode.querySelectorAll('button').forEach(function(x){
          x.classList.toggle('on', x.dataset.v === r[act]); });
        markDirty(); return;
      }
    });
    box.addEventListener('input', function(e){
      if(e.target.dataset.act !== 'note') return;
      var card = e.target.closest('.row');
      var arr = zone === 'rows' ? S.rows : S.added;
      arr[+card.dataset.i].note = e.target.value;
      markDirty();
    });
  });
}

// ─────────── Вкладка 2: данные по рынку ───────────
/**
 * Штатка подразделения и записи, разложенные по должностям.
 * Должности, которых нет в штатке, идут отдельной группой в конце —
 * их вносили вручную, и терять их нельзя.
 */
function survGroups(){
  var штатка = (S.data.positionsByUnit && S.data.positionsByUnit[S.unit]) || [];
  var groups = [], byPos = {};

  штатка.forEach(function(p){
    var g = { pos: p, items: [], extra: false };
    byPos[norm(p)] = g;
    groups.push(g);
  });

  var tail = [];
  S.surveys.forEach(function(r, i){
    var g = byPos[norm(r.posOur)];
    if(g){ g.items.push(i); return; }
    var t = tail.filter(function(x){ return norm(x.pos) === norm(r.posOur); })[0];
    if(!t){ t = { pos: r.posOur || '(должность не указана)', items: [], extra: true }; tail.push(t); }
    t.items.push(i);
  });

  return { groups: groups.concat(tail), штатка: штатка };
}

function norm(s){ return String(s == null ? '' : s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim(); }

/** Подпись на вкладке шага 2: «закрыто/всего» по штатке, иначе просто число записей. */
function svLabel(){
  var g = survGroups();
  if(!g.groups.length) return String(S.surveys.length);
  var closed = g.groups.filter(function(x){ return x.items.length; }).length;
  return closed + '/' + g.groups.length;
}

function renderTabSurvey(){
  var G = survGroups();
  var h = '';

  if(!G.штатка.length && !S.surveys.length){
    h += '<div class="empty"><b>Здесь пока пусто</b><br><br>' +
         'Для этого подразделения штатка не заведена.<br>' +
         'Добавьте должность кнопкой ниже — она попадёт и в справочник.<br><br>' +
         'Одна запись = одна должность в одной компании.</div>';
  } else {
    var closed = G.groups.filter(function(g){ return g.items.length; }).length;
    h += '<div class="sec-title">Должности подразделения · закрыто ' + closed +
         ' из ' + G.groups.length + '</div>';

    h += '<div class="pos-grid">' + G.groups.map(function(g, gi){
      var n = g.items.length;
      var cos = g.items.map(function(i){ return S.surveys[i].company; }).filter(String);
      var cls = 'pos' + (n ? ' pos-done' : '');

      var x = '<div class="'+cls+'">';
      x += '<div class="pos-head" data-toggle="'+gi+'">';
      x += '<div class="pos-body"><div class="pos-name">'+esc(g.pos)+
           (g.extra ? ' <span class="pill p-mid">не в штатке</span>' : '')+'</div>';
      x += '<div class="pos-sub">'+ (n
            ? esc(cos.slice(0,3).join(', ')) + (cos.length > 3 ? ' и ещё ' + (cos.length-3) : '')
            : 'данных нет') +'</div></div>';
      x += '<div class="pos-cnt">'+(n ? n : '—')+'</div>';
      if(n) x += '<div class="pos-chev">▾</div>';
      x += '</div>';

      // записи по должности — скрыты, пока не раскроют
      x += '<div class="pos-items hidden" data-items="'+gi+'">';
      x += g.items.map(function(i){ return svCard(S.surveys[i], i); }).join('');
      if(!S.ro){
        x += '<button class="btn-line" data-add="'+gi+'" style="margin-top:2px">'+
             '+ Ещё компания по этой должности</button>';
      }
      x += '</div>';

      if(!n && !S.ro){
        x += '<button class="btn-line pos-go" data-add="'+gi+'">Внести данные</button>';
      }
      x += '</div>';
      return x;
    }).join('') + '</div>';
  }

  if(!S.ro){
    h += '<button id="btnAddSv" class="btn-line" style="margin-top:14px">'+
         '+ Должность, которой нет в списке</button>';
  }
  $('tabBody').innerHTML = h;

  $('tabBody').onclick = function(e){
    // раскрыть или свернуть должность
    var head = e.target.closest('.pos-head');
    if(head && !e.target.closest('button')){
      var box = $('tabBody').querySelector('[data-items="'+head.dataset.toggle+'"]');
      if(box && box.children.length){
        var closedNow = box.classList.toggle('hidden');
        var chev = head.querySelector('.pos-chev');
        if(chev) chev.textContent = closedNow ? '▾' : '▴';
      }
      return;
    }
    // внести данные по конкретной должности — она подставится в форму
    var add = e.target.closest('button[data-add]');
    if(add){
      openSurveySheet(-1, G.groups[+add.dataset.add].pos);
      return;
    }
    var b = e.target.closest('button[data-sv]');
    if(!b) return;
    var i = +b.dataset.i;
    if(b.dataset.sv === 'edit') openSurveySheet(i);
    if(b.dataset.sv === 'del'){
      var r = S.surveys[i];
      ask({
        title: 'Удалить запись?',
        html: '<b>'+esc(r.posOur || '(должность не указана)')+'</b>'+
              (r.company ? ' · '+esc(r.company) : ''),
        ok: 'Удалить',
        danger: true
      }).then(function(yes){
        if(!yes) return;
        if(r.id && r.id.indexOf('tmp') !== 0) S.removed.push(r.id);
        S.surveys.splice(i,1);
        markDirty();
        renderUnit();
        toast('Запись удалена. Нажмите «Сохранить», чтобы применить в таблице.');
      });
    }
  };
  if($('btnAddSv')) $('btnAddSv').onclick = function(){ openSurveySheet(-1); };
}

function money(r){
  // значения приходят и как «5 500», и как «5500.5» — сначала приводим к числу
  var num = function(x){
    var s = String(x == null ? '' : x).replace(/[\s ]/g,'').replace(',','.');
    if(!s) return '';
    var n = Number(s);
    if(isNaN(n)) return String(x).trim();
    return n.toLocaleString('ru-RU');
  };
  var f = num(r.payFrom), t = num(r.payTo);
  if(!f && !t) return '';
  var s = (f && t) ? (f + ' – ' + t) : (f || t);
  return s + (r.cur ? ' ' + r.cur : '') + (r.payPer ? ' ' + r.payPer : '');
}

function svCard(r, i){
  var h = '<div class="sv">';
  h += '<div class="sv-pos">'+esc(r.posOur || '(должность не указана)')+
       (r.posTheir ? ' <span style="color:var(--muted);font-weight:400">→ '+esc(r.posTheir)+'</span>' : '')+'</div>';
  h += '<div class="sv-co">'+esc(r.company || '(компания не указана)')+
       (r.grade ? ' · '+esc(r.grade) : '')+'</div>';
  var m = money(r);
  if(m) h += '<div class="sv-pay">'+esc(m)+'</div>';
  if(r.bonHas === 'да'){
    h += '<div class="sv-line">Бонус: '+esc([r.bonSize, r.bonType, r.bonPer].filter(String).join(' · ') || 'есть')+'</div>';
  } else if(r.bonHas === 'нет'){
    h += '<div class="sv-line">Бонусов нет</div>';
  }
  if(r.extra) h += '<div class="sv-line">Прочее: '+esc(r.extra)+'</div>';
  if(r.benefits && r.benefits.length){
    var vis = r.benefits.slice(0,3), rest = r.benefits.length - vis.length;
    h += '<div class="sv-tags">'+vis.map(function(b){ return '<span>'+esc(b)+'</span>'; }).join('')+
         (rest>0 ? '<span>+'+rest+'</span>' : '')+'</div>';
  }
  if(r.note) h += '<div class="sv-line" style="font-style:italic">'+esc(r.note)+'</div>';
  var meta = [r.source, r.trust ? 'достоверность: '+r.trust : ''].filter(String).join(' · ');
  if(meta) h += '<div class="sv-by">'+esc(meta)+'</div>';
  if(r.by) h += '<div class="sv-by">'+esc(r.by)+(r.at ? ' · '+esc(r.at) : '')+'</div>';
  if(!S.ro){
    h += '<div class="sv-act">'+
      '<button data-sv="edit" data-i="'+i+'">Изменить</button>'+
      '<button data-sv="del" data-i="'+i+'" class="btn-danger">Удалить</button></div>';
  }
  h += '</div>';
  return h;
}

/** Форма добавления/правки записи. i = -1 — новая. */
function openSurveySheet(i, presetPos){
  var isNew = i < 0;
  var r = isNew
    ? { id:'', unit:S.unit, company:'', posOur: presetPos || '', posTheir:'', grade:'',
        payFrom:'', payTo:'', cur:'сомони', payPer:'в месяц',
        bonHas:'', bonSize:'', bonType:'', bonPer:'',
        benefits:[], extra:'', source:'', trust:'', note:'' }
    : JSON.parse(JSON.stringify(S.surveys[i]));

  var ref = S.data.ref;
  var coList = S.rows.map(function(x){ return x.company; })
    .concat(S.added.map(function(x){ return x.company; }))
    .filter(function(v,k,a){ return v && a.indexOf(v) === k; });
  if(r.company && coList.indexOf(r.company) < 0) coList.unshift(r.company);

  var el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = '<div class="sheet-in">'+
    '<div class="sheet-hd"><b>'+(isNew?'Новая запись':'Изменить запись')+'</b>'+
      '<button class="btn-ghost" data-x="1">Закрыть</button></div>'+

    '<label class="lbl" style="margin-top:6px">Компания-конкурент</label>'+
    '<select id="fCo">'+
      '<option value="">— выберите —</option>'+
      coList.map(function(c){ return '<option'+(c===r.company?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+
      '<option value="__other__">Другая компания…</option>'+
    '</select>'+
    '<input id="fCoOther" class="hidden" placeholder="Название компании" style="margin-top:8px">'+

    '<label class="lbl">Должность у нас</label>'+
    pickField('fPosOur', r.posOur, 'Выберите должность', true)+

    '<label class="lbl">Как эта должность называется у них</label>'+
    pickField('fPosTheir', r.posTheir, 'Выберите или добавьте', false)+

    '<label class="lbl">Уровень / грейд (необязательно)</label>'+
    '<input id="fGrade" value="'+esc(r.grade)+'">'+

    '<label class="lbl">Оклад</label>'+
    '<div class="two"><div><input id="fFrom" inputmode="decimal" placeholder="от" value="'+esc(r.payFrom)+'"></div>'+
      '<div><input id="fTo" inputmode="decimal" placeholder="до" value="'+esc(r.payTo)+'"></div></div>'+
    '<div style="height:8px"></div>'+ chips('cur', ref.currencies, r.cur, false, true) +
    '<div style="height:6px"></div>'+ chips('payPer', ref.payPeriods, r.payPer, false, true) +

    '<label class="lbl">Бонусы и премии</label>'+
    chips('bonHas', ['да','нет','не знаю'], r.bonHas, false) +
    '<div id="bonBox" class="'+(r.bonHas==='да'?'':'hidden')+'">'+
      '<label class="lbl">Размер бонуса</label>'+
      '<input id="fBonSize" inputmode="decimal" placeholder="Например: 20 или 3000" value="'+esc(r.bonSize)+'">'+
      '<div style="height:8px"></div>'+ chips('bonType', ref.bonusTypes, r.bonType, false) +
      '<div style="height:6px"></div>'+ chips('bonPer', ref.bonusPeriods, r.bonPer, false) +
    '</div>'+

    '<label class="lbl">Льготы и соцпакет</label>'+
    chips('benefits', S.data.benefits || [], r.benefits, true) +

    '<label class="lbl">Прочие выплаты (необязательно)</label>'+
    '<input id="fExtra" placeholder="13-я зарплата, доплата за стаж…" value="'+esc(r.extra)+'">'+

    '<label class="lbl">Откуда данные</label>'+ chips('source', ref.sources, r.source, false) +
    '<label class="lbl">Насколько данные надёжны</label>'+ chips('trust', ref.trust, r.trust, false) +

    '<label class="lbl">Комментарий</label>'+
    '<textarea id="fNote">'+esc(r.note)+'</textarea>'+

    '<div style="height:16px"></div>'+
    '<button id="fGo" class="btn-primary">'+(isNew?'Добавить':'Сохранить изменения')+'</button>'+
    '<div style="height:10px"></div></div>';

  document.body.appendChild(el);

  var coSel = el.querySelector('#fCo'), coOther = el.querySelector('#fCoOther');
  coSel.onchange = function(){
    var other = this.value === '__other__';
    coOther.classList.toggle('hidden', !other);
    if(other) coOther.focus();
  };

  // Должности — строгий выбор из штатки, с поиском.
  // «У нас» — только должности своего подразделения, добавление пишется туда же.
  // «У конкурента» — весь холдинг: у них своя штатка, нашей её ограничивать нельзя.
  var bindPick = function(id, field, opt){
    var btn = el.querySelector('#'+id);
    btn.onclick = function(){
      openPicker({
        title: opt.title,
        list: opt.list(),
        wide: opt.wide ? opt.wide() : null,
        wideLabel: opt.wideLabel,
        addUnit: opt.addUnit ? S.unit : null,
        value: r[field],
        onPick: function(v){
          r[field] = v;
          btn.querySelector('span').textContent = v;
          btn.querySelector('span').className = '';
          btn.classList.remove('need');
        }
      });
    };
  };
  bindPick('fPosOur', 'posOur', {
    title: 'Должность у нас',
    list: function(){ return S.data.positions || []; },
    wide: function(){ return S.data.positionsAll || []; },
    wideLabel: 'Показать все должности холдинга',
    addUnit: true
  });
  bindPick('fPosTheir', 'posTheir', {
    title: 'Должность у конкурента',
    list: function(){ return S.data.positionsAll || []; }
  });

  el.addEventListener('click', function(e){
    if(e.target === el || e.target.dataset.x){ el.remove(); return; }
    var b = e.target.closest('.chips button');
    if(!b) return;
    var box = b.parentNode, act = b.dataset.act, v = b.dataset.v;
    if(box.dataset.multi){
      var k = r.benefits.indexOf(v);
      if(k >= 0) r.benefits.splice(k,1); else r.benefits.push(v);
      b.classList.toggle('on', k < 0);
    } else {
      // обязательные группы (валюта, период оклада) снять нельзя — только переключить
      r[act] = (r[act] === v && !box.dataset.req) ? '' : v;
      box.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x.dataset.v === r[act]); });
      if(act === 'bonHas') el.querySelector('#bonBox').classList.toggle('hidden', r.bonHas !== 'да');
    }
  });

  el.querySelector('#fGo').onclick = function(){
    var co = coSel.value === '__other__' ? coOther.value.trim() : coSel.value;
    if(!co){ toast('Выберите или впишите компанию'); return; }
    if(!r.posOur){
      toast('Выберите должность у нас');
      el.querySelector('#fPosOur').classList.add('need');
      el.querySelector('#fPosOur').scrollIntoView({block:'center'});
      return;
    }

    r.company   = co;
    r.grade     = el.querySelector('#fGrade').value.trim();
    r.payFrom   = el.querySelector('#fFrom').value.trim();
    r.payTo     = el.querySelector('#fTo').value.trim();
    r.bonSize   = el.querySelector('#fBonSize').value.trim();
    r.extra     = el.querySelector('#fExtra').value.trim();
    r.note      = el.querySelector('#fNote').value.trim();
    if(r.bonHas !== 'да'){ r.bonSize=''; r.bonType=''; r.bonPer=''; }

    if(isNew){ r.id = uid(); S.surveys.push(r); }
    else { S.surveys[i] = r; }

    el.remove();
    markDirty();
    renderUnit();
    toast(isNew ? 'Запись добавлена. Не забудьте «Сохранить».' : 'Изменено. Не забудьте «Сохранить».');
  };

  setTimeout(function(){ el.querySelector('.sheet-in').scrollTop = 0; }, 30);
}

// ОБЩЕЕ: черновик, прогресс
// ═══════════════════════════════════════════════════════════
function markDirty(){
  if(S.ro) return;
  S.dirty = true;
  store.set(LS_DRAFT+S.unit, JSON.stringify({
    rows:S.rows, added:S.added, surveys:S.surveys, removed:S.removed, note:S.note }));
}

function updateProgress(){
  var c = counts();

  if(S.tab === 'comp'){
    $('progT').textContent = c.done + ' из ' + c.all;
    if(c.ask){
      $('progS').className = 'ask';
      $('progS').textContent = 'уточнить: ' + c.ask;
    } else {
      $('progS').className = '';
      $('progS').textContent = (c.all && c.done === c.all) ? 'всё проверено' : 'проверено компаний';
    }
  } else {
    // Ориентир — закрытые должности штатки, а не число записей:
    // так у человека виден финиш, а не бесконечный список.
    var g = survGroups();
    if(g.groups.length){
      var closed = g.groups.filter(function(x){ return x.items.length; }).length;
      $('progT').textContent = closed + ' из ' + g.groups.length;
      $('progS').className = '';
      $('progS').textContent = (closed === g.groups.length) ? 'все должности закрыты' : 'должностей закрыто';
    } else {
      $('progT').textContent = S.surveys.length + (S.removed.length ? ' (−'+S.removed.length+')' : '');
      $('progS').className = '';
      $('progS').textContent = 'записей по должностям';
    }
  }

  // счётчики на вкладках должны меняться сразу, а не после сохранения
  var t1 = document.querySelector('.tabs button[data-tab="comp"]');
  var t2 = document.querySelector('.tabs button[data-tab="survey"]');
  if(t1){
    t1.innerHTML = '<small>Шаг 1</small>Конкуренты · ' + c.done + '/' + c.all +
      (c.ask ? ' <span style="color:var(--warn)">?'+c.ask+'</span>' : '');
    t1.classList.toggle('done', c.all > 0 && c.done === c.all);
  }
  if(t2){
    t2.innerHTML = '<small>Шаг 2</small>Данные по рынку · ' + svLabel();
    t2.classList.toggle('done', S.surveys.length > 0);
  }

  $('btnSave').classList.toggle('hidden', S.ro);
  $('btnSave').textContent = 'Сохранить';
}

function openAddSheet(){
  var picked = { type:'', prio:'', seg:'', region:'' };

  var el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = '<div class="sheet-in">'+
    '<div class="sheet-hd"><b>Добавить компанию</b>'+
      '<button class="btn-ghost" data-x="1">Закрыть</button></div>'+
    '<div id="addWarn"></div>'+
    '<label class="lbl">Название компании</label>'+
    '<input id="addName" placeholder="Начните вводить…" autocomplete="off">'+
    '<div id="addSug"></div>'+
    '<label class="lbl">Тип конкурента</label>'+ chips('type', S.data.ref.types, '', false) +
    '<label class="lbl">Приоритет</label>'+ chips('prio', S.data.ref.priorities, '', false) +
    '<label class="lbl">Сегмент</label>'+ pickField('addSeg', '', 'Выберите сегмент', false) +
    '<label class="lbl">Регион</label>'+ pickField('addReg', '', 'Выберите регион', false) +
    '<label class="lbl">Комментарий</label><textarea id="addNote"></textarea>'+
    '<div style="height:14px"></div>'+
    '<button id="addGo" class="btn-primary">Добавить в список</button></div>';
  document.body.appendChild(el);

  // Сегмент и регион — из справочника, чтобы «Худжанд», «Худжанд (ГО)» и «худжанд»
  // не расползались по таблице тремя разными значениями
  var bindRef = function(id, field, title, block, list){
    var btn = el.querySelector('#'+id);
    btn.onclick = function(){
      openPicker({
        title: title, block: block, list: list(), value: picked[field],
        onPick: function(v){
          picked[field] = v;
          btn.querySelector('span').textContent = v;
          btn.querySelector('span').className = '';
        }
      });
    };
  };
  bindRef('addSeg', 'seg', 'Сегмент', 'segments', function(){ return S.data.segments || []; });
  bindRef('addReg', 'region', 'Регион присутствия', 'regions', function(){ return S.data.regions || []; });

  el.addEventListener('click', function(e){
    if(e.target === el || e.target.dataset.x){ el.remove(); return; }
    var b = e.target.closest('.chips button');
    if(!b) return;
    var act = b.dataset.act;
    picked[act] = (picked[act] === b.dataset.v) ? '' : b.dataset.v;
    b.parentNode.querySelectorAll('button').forEach(function(x){
      x.classList.toggle('on', x.dataset.v === picked[act]); });
  });

  var nameEl = el.querySelector('#addName');
  nameEl.oninput = function(){
    var q = this.value.trim().toLowerCase();
    var w = el.querySelector('#addWarn'); w.innerHTML = '';
    if(q.length >= 2){
      var bad = S.data.banned.filter(function(b){ return b.name.toLowerCase().indexOf(q) >= 0; });
      if(bad.length) w.innerHTML = '<div class="note">«'+esc(bad[0].name)+'» — '+esc(bad[0].reason)+
        '. Эту компанию включать в обзор нельзя.</div>';
    }
    var box = el.querySelector('#addSug');
    if(q.length < 2){ box.innerHTML = ''; return; }
    var hit = S.data.companies.filter(function(c){ return c.name.toLowerCase().indexOf(q) >= 0; }).slice(0,7);
    box.innerHTML = hit.length ? '<div class="sug">'+hit.map(function(c){
      return '<div data-n="'+esc(c.name)+'" data-s="'+esc(c.seg)+'" data-r="'+esc(c.region)+'">'+
        esc(c.name)+'<small>'+esc([c.seg,c.region].filter(String).join(' · '))+'</small></div>'; }).join('')+'</div>' : '';
    box.querySelectorAll('[data-n]').forEach(function(d){
      d.onclick = function(){
        nameEl.value = d.dataset.n;
        if(d.dataset.s){
          picked.seg = d.dataset.s;
          var s = el.querySelector('#addSeg span');
          s.textContent = d.dataset.s; s.className = '';
        }
        if(d.dataset.r){
          picked.region = d.dataset.r;
          var g = el.querySelector('#addReg span');
          g.textContent = d.dataset.r; g.className = '';
        }
        box.innerHTML = '';
      };
    });
  };

  el.querySelector('#addGo').onclick = function(){
    var name = nameEl.value.trim();
    if(!name){ toast('Введите название компании'); return; }
    var dup = S.rows.concat(S.added).some(function(r){
      return r.company.toLowerCase() === name.toLowerCase(); });
    if(dup){ toast('Такая компания уже есть в списке'); return; }
    S.added.push({
      id:'', unit:S.unit, company:name, type:picked.type, prio:picked.prio,
      seg: picked.seg,
      region: picked.region,
      note: el.querySelector('#addNote').value.trim(),
      status:'', src:'', actual:'актуально'
    });
    el.remove();
    markDirty();
    renderUnit();
    toast('Компания добавлена. Не забудьте сохранить.');
  };
  setTimeout(function(){ nameEl.focus(); }, 60);
}

$('btnSave').onclick = function(){ save(false); };

function save(submit){
  if(S.saving || S.ro) return;
  if(!submit){ doSave(false); return; }

  var c = counts();
  var q = null;
  if(c.left){
    q = { html: 'Не отмечено компаний: <b>'+c.left+'</b>.' +
                (c.ask ? '\nЕщё <b>'+c.ask+'</b> отложено на уточнение — они тоже не считаются проверенными.' : '') };
  } else if(c.ask){
    q = { html: 'Компаний на уточнении: <b>'+c.ask+'</b>.\n' +
                'Они не считаются проверенными — вопрос по ним ещё открыт.' };
  }
  if(!q){ doSave(true); return; }

  ask({
    title: 'Отправить как готовое?',
    html: q.html,
    ok: 'Всё равно отправить',
    cancel: 'Вернуться'
  }).then(function(yes){ if(yes) doSave(true); });
}

function doSave(submit){
  if(S.saving || S.ro) return;
  S.saving = true;
  $('btnSave').disabled = true;
  $('btnSave').textContent = 'Сохраняем…';

  var unitAtSave = S.unit;

  // Обе вкладки сохраняются вместе — человек не должен думать, где он находится
  var p1 = call('apiSave', S.token, {
    unit: unitAtSave, rows: S.rows, added: S.added, note: S.note, submit: !!submit });

  var needSurvey = S.surveys.length > 0 || S.removed.length > 0;
  var p2 = needSurvey
    ? call('apiSaveSurvey', S.token, { unit: unitAtSave, upsert: S.surveys, remove: S.removed })
    : Promise.resolve({ ok:true, newIds:[], added:0, updated:0, removed:0 });

  Promise.all([p1, p2]).then(function(res){
    S.saving = false;
    $('btnSave').disabled = false;
    $('btnSave').textContent = 'Сохранить';

    var a = res[0], b = res[1];
    if(!a || !a.ok || !b || !b.ok){
      var msg = (a && !a.ok && a.error) || (b && !b.ok && b.error) || 'Не удалось сохранить';
      toast(msg);
      if(msg.indexOf('Сессия') === 0){
        store.del(LS_TOKEN);
        setTimeout(function(){ location.reload(); }, 1600);
      }
      return;
    }

    S.dirty = false;
    store.del(LS_DRAFT + unitAtSave);

    // Конкуренты: добавленные получили ID — переносим в основной список
    S.added.forEach(function(x, k){
      x.id = (a.newIds && a.newIds[k]) || x.id;
      if(x.id){ S.rows.push(x); S.data.rows.push(x); }
    });
    S.added = [];
    syncCache(S.rows, S.data.rows);

    // Обзор: newIds идёт в том же порядке, что и отправленный upsert
    (b.newIds || []).forEach(function(id, k){
      if(id && S.surveys[k]) S.surveys[k].id = id;
    });
    S.removed = [];
    S.data.surveys = S.data.surveys.filter(function(x){ return x.unit !== unitAtSave; })
      .concat(S.surveys.map(function(x){ return JSON.parse(JSON.stringify(x)); }));

    var u = S.data.units.filter(function(x){ return x.unit === unitAtSave; })[0];
    if(u){
      var after = counts();
      u.total = after.all;
      u.done = after.done;
      u.ask = after.ask;
      u.surveys = S.surveys.length;
    }

    toast(submit ? 'Отправлено. Спасибо!' : 'Сохранено в ' + a.at);
    if(submit) setTimeout(renderUnits, 900);
    else renderUnit();
  }).catch(function(){
    S.saving = false;
    $('btnSave').disabled = false;
    $('btnSave').textContent = 'Сохранить';
    toast('Нет связи. Черновик сохранён на устройстве — попробуйте позже.');
  });
}

function syncCache(local, cache){
  var byId = {};
  local.forEach(function(x){ if(x.id) byId[x.id] = x; });
  cache.forEach(function(x){ if(byId[x.id] && byId[x.id] !== x) Object.assign(x, byId[x.id]); });
}

window.addEventListener('beforeunload', function(e){
  if(S.dirty){ e.preventDefault(); e.returnValue = ''; }
});

    '</div>'+
    '<div class="kpi-card">'+

    '</div>'+

      '<div class="kpi-s">Сформировано перцентилей</div>'+
    '</div>'+
  '</div>';

  // 2. Вкладки Дашборда
  var tabs = [
    { id:'salaries', icon:'wallet', label:'Зарплатные вилки' },
    { id:'progress', icon:'target', label:'Прогресс по HR BP' },
    { id:'benefits', icon:'medal', label:'Льготы и Бонусы' }
  ];
  h += '<div class="sub-tabs">'+ tabs.map(function(t){
    var on = S.dashTab === t.id ? ' on' : '';
    return '<button class="sub-tab'+on+'" data-dtab="'+t.id+'">'+ic(t.icon)+esc(t.label)+'</button>';
  }).join('') +'</div>';

  // 3. Панель фильтров
  var allDirs = (d.dirProgress || []).map(function(x){ return x.dir; }).filter(function(x){ return x && x !== 'Без направления'; });
  var allHrbps = (d.hrbpProgress || []).map(function(x){ return x.hrbp; }).filter(function(x){ return x && x !== 'Не назначен'; });

  h += '<div class="dash-filters">'+
    '<div class="search-wrap">'+icBare('search')+
      '<input id="dashSearch" placeholder="Поиск должности или компании…" value="'+esc(S.dashFilters.search)+'"></div>'+
    '<select id="dashDir">'+
      '<option value="">Все направления</option>'+
      allDirs.map(function(dir){
        return '<option value="'+esc(dir)+'"'+(S.dashFilters.dir===dir?' selected':'')+'>'+esc(dir)+'</option>';
      }).join('')+
    '</select>'+
    '<select id="dashHrbp">'+
      '<option value="">Все HR BP</option>'+
      allHrbps.map(function(h){
        return '<option value="'+esc(h)+'"'+(S.dashFilters.hrbp===h?' selected':'')+'>'+esc(h)+'</option>';
      }).join('')+
    '</select>'+

  '</div>';

function renderSalariesTab(positions){
  if(!positions.length){
    return '<div class="empty">По заданным условиям должностей не найдено</div>';
  }

  var h = '<div class="sec-title">Зарплатные вилки по должностям ('+positions.length+')</div>';

  h += '<div class="fork-grid">' + positions.map(function(pos, idx){
    var maxVal = Math.max(pos.max, 1);
    var p25Pct = pos.min > 0 ? Math.round((pos.p25 / maxVal) * 100) : 0;
    var p75Pct = pos.min > 0 ? Math.round((pos.p75 / maxVal) * 100) : 0;
    var medPct = pos.min > 0 ? Math.round((pos.median / maxVal) * 100) : 0;
    var wPct = Math.max(p75Pct - p25Pct, 4);

    var cardId = 'posCard_' + idx;
    var bodyId = 'posBody_' + idx;

    var forkVisual = pos.min > 0
      ? '<div class="fork-nums">'+
          '<span>Мин: <b>'+pos.min.toLocaleString('ru-RU')+'</b></span>'+
          '<span>P25: <b>'+pos.p25.toLocaleString('ru-RU')+'</b></span>'+
          '<span class="f-med">Медиана: <b>'+pos.median.toLocaleString('ru-RU')+'</b></span>'+
          '<span>P75: <b>'+pos.p75.toLocaleString('ru-RU')+'</b></span>'+
          '<span>Макс: <b>'+pos.max.toLocaleString('ru-RU')+'</b></span>'+
        '</div>'+
        '<div class="fork-track-wrap">'+
          '<div class="fork-track-p25-p75" style="left:'+p25Pct+'%;width:'+wPct+'%"></div>'+
          '<div class="fork-track-med" style="left:'+medPct+'%"></div>'+
        '</div>'
      : '<div style="font-size:12.5px;color:var(--muted);margin:6px 0">Нет числовых данных по окладу</div>';

    var coList = (pos.companies || []).map(function(c){
      var payStr = (c.pFrom || c.pTo)
        ? (c.pFrom ? c.pFrom.toLocaleString('ru-RU') : '—') + ' … ' + (c.pTo ? c.pTo.toLocaleString('ru-RU') : '—') + ' ' + esc(c.cur)
        : 'не указан';
      var bonStr = c.bonHas === 'да' ? (esc(c.bonType || 'Бонус') + (c.bonSize ? ': ' + esc(c.bonSize) : '')) : (c.bonHas === 'нет' ? 'Без бонуса' : '—');
      var bList = (c.benefits || []).map(function(b){ return '<span class="pill p-ok" style="font-size:10.5px;margin-right:3px">'+esc(b)+'</span>'; }).join('');

      return '<tr>'+
        '<td><b>'+esc(c.company)+'</b><br><small style="color:var(--muted)">'+esc(c.unit)+'</small></td>'+
        '<td>'+payStr+'</td>'+
        '<td>'+bonStr+'</td>'+
        '<td>'+(bList || '<span style="color:var(--muted)">—</span>')+'</td>'+
        '<td><small style="color:var(--muted)">'+esc(c.note || '—')+'</small></td>'+
      '</tr>';
    }).join('');

    return '<div class="fork-box" id="'+cardId+'">'+
      '<div class="fork-hd" onclick="togglePosBody(\''+bodyId+'\')">'+
        '<div class="fork-pos">'+esc(pos.pos)+'</div>'+
        '<div class="fork-cnt">'+pos.count+' '+declOfNum(pos.count, ['запись','записи','записей'])+'</div>'+
        (pos.forkSpreadPct ? '<div class="pill p-mid">размах +'+pos.forkSpreadPct+'%</div>' : '')+
        '<div style="font-size:18px;color:var(--muted)">▾</div>'+
      '</div>'+
      forkVisual +
      '<div id="'+bodyId+'" class="fork-body hidden">'+
        '<div class="tblwrap">'+
          '<table class="co-tbl">'+
            '<tr><th>Компания / Отдел</th><th>Вилка оклада</th><th>Премии</th><th>Льготы</th><th>Примечание</th></tr>'+
            coList +
          '</table>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('') + '</div>';

  return h;
}

  var el = $(id);
  if(el) el.classList.toggle('hidden');
}

function renderProgressTab(hrbpList, dirList){
  var h = '<div class="sec-title">Прогресс сбора по HR BP</div>';

  if(S.data && (S.data.user.role === 'admin' || S.data.user.role === 'cb')){
    h += '<div style="margin-bottom:14px">'+
      '<button id="btnMassReminder" class="btn-primary" style="width:auto;font-size:13.5px;min-height:38px">'+

  }

    var isDone = hItem.pct >= 100;
    var cls = isDone ? 'p-ok' : (hItem.pct > 0 ? 'p-mid' : 'p-no');
    return '<div class="prog-row">'+
      '<div class="prog-hd">'+

      '</div>'+
      '<div class="prog-sub">'+
        '<span>Подразделений: <b>'+hItem.unitsDone+' / '+hItem.unitsTotal+'</b></span>'+
        '<span>Связей: <b>'+hItem.compDone+' / '+hItem.compTotal+'</b> · Анкет: <b>'+hItem.surveysTotal+'</b></span>'+
      '</div>'+
    '</div>';
  }).join('');

  h += '<div class="sec-title" style="margin-top:24px">Прогресс сбора по Дирекциям</div>';
  h += dirList.map(function(dItem){
    var isDone = dItem.pct >= 100;
    var cls = isDone ? 'p-ok' : (dItem.pct > 0 ? 'p-mid' : 'p-no');
    return '<div class="prog-row">'+
      '<div class="prog-hd">'+
        '<span>'+esc(dItem.dir)+'</span>'+
        '<span class="pill '+cls+'">'+dItem.pct+'%</span>'+
      '</div>'+

  setTimeout(function(){

          ok: 'Отправить напоминания'
        }).then(function(yes){

          }).catch(function(){
            b.disabled = false; b.innerHTML = ic('megaphone')+'Напомнить всем должникам в Telegram';
            toast('Нет связи');
          });
        });
      };
    }
  }, 100);

  return h;
}

function exportDashboardCSV(){
  if(!S.dashData || !S.dashData.positions || !S.dashData.positions.length){
    toast('Нет данных для экспорта');
    return;
  }
  var headers = ['Должность', 'Всего записей', 'С окладом', 'Мин (TJS)', '25% перцентиль (TJS)', 'Медиана (TJS)', '75% перцентиль (TJS)', 'Макс (TJS)', 'Среднее (TJS)', 'Размах вилки (%)'];
  var rows = S.dashData.positions.map(function(p){
    return [
      '"' + (p.pos || '').replace(/"/g, '""') + '"',
      p.count,
      p.withSalaryCount,
      p.min,
      p.p25,
      p.median,
      p.p75,
      p.max,
      p.avg,
      p.forkSpreadPct + '%'
    ].join(';');
  });

  var csvContent = '\uFEFF' + headers.join(';') + '\n' + rows.join('\n');
  var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Обзор_рынка_зарплатные_вилки_C&B.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Файл отчёта CSV сформирован и скачан');
}

function declOfNum(n, titles){
  return titles[(n%10===1 && n%100!==11) ? 0 : (n%10>=2 && n%10<=4 && (n%100<10 || n%100>=20)) ? 1 : 2];
}

      '<td class="u-t-fio">'+esc(u.fio)+'</td>'+
