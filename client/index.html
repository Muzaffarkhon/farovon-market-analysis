<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Фаза 0 редизайна: убраны maximum-scale/user-scalable (запрет зума — нарушение
       WCAG 1.4.4); добавлен color-scheme, чтобы браузер красил системный UI и фон
       до применения style.css и не мигал в тёмной ОС. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Совместный сбор и анализ данных о зарплатах, бонусах и льготах на рынке труда — для руководителей направлений, HR BP, C&amp;B и компаний-участников обзора.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Обзор рынка вознаграждений · Фаровон">
  <meta property="og:description" content="Совместный сбор и анализ рыночных зарплат, бонусов и льгот.">
  <meta name="robots" content="noindex">
  <!-- Фаза 1: применяем сохранённый выбор темы до первой отрисовки, чтобы не
       было вспышки. 'system' (или отсутствие ключа) — атрибут не ставим,
       работает @media prefers-color-scheme. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('farovon_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <title>Обзор рынка вознаграждений</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M4 19V10M12 19V5M20 19V13' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- Веб-шрифтов нет намеренно: Google Fonts (fonts.gstatic.com) у аудитории
       часто режется, а display=swap на мобильной сети даёт моргание и
       перекладку текста. Интерфейс на системном шрифте ОС — как в «Кафетерии
       льгот»: на телефоне всегда родной SF Pro / Roboto, ноль загрузки. -->
  <!-- Без ручного ?v=… : сервер отдаёт style.css/js с Cache-Control: no-cache,
       no-store (см. src/server.js) — браузер и так берёт свежую версию. -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Обзор рынка">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css?v=2.5.37">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ══════════ ВХОД ══════════ -->
<div id="scrLogin" class="login hidden">
  <button id="btnThemeLogin" class="theme-fab" aria-label="Тема оформления" title="Тема: как в системе"></button>
  <!-- Один адаптивный макет: на телефоне брендовый блок компактно над формой,
       от 960px — сплит-экран (панель слева, форма справа). См. .login-brand в style.css. -->
  <div class="login-brand">
    <div class="brand-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 19V10M12 19V5M20 19V13" stroke="white" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <h1>Обзор рынка вознаграждений</h1>
    <p>Совместный сбор и анализ данных о зарплатах, бонусах и льготах на рынке труда. Для руководителей направлений, HR&nbsp;BP, C&amp;B и компаний — участников обзора.</p>
  </div>

  <div class="login-form-col">
    <div class="logo">
      <div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 19V10M12 19V5M20 19V13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      <b>Обзор рынка</b>
      <span>Обзор вознаграждений · Фаровон</span>
    </div>

    <div id="loginCard" class="card">
      <div id="loginErr" class="err hidden"></div>
      <label class="lbl" style="margin-top:0">Логин</label>
      <input id="inLogin" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="email" placeholder="например: ivanov.ii">
      <label class="lbl">Пароль</label>
      <div class="pw-wrap">
        <input id="inPass" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="button" id="pwEye" class="pw-eye" tabindex="-1" aria-label="Показать пароль">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
      </div>
      <div style="height:18px"></div>
      <button id="btnLogin" class="btn-primary">Войти в систему</button>
    </div>
    <div id="loginHelp"></div>
  </div>
</div>

<!-- ══════════ ЗАГРУЗКА ══════════ -->
<div id="scrLoad" class="sp"><i></i> Загрузка данных…</div>

<!-- ══════════ ПРИЛОЖЕНИЕ ══════════ -->
<div id="app" class="hidden">
  <!-- Видна только от 1024px и шире (см. .rail в style.css) — на мобильном
       остаётся прежняя навигация через ⋮ и нижний #topNav. -->
  <div class="rail" id="rail">
    <div class="rail-brand" id="railBrand" title="Свернуть / развернуть меню">
      <div class="rail-brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 19V10M12 19V5M20 19V13" stroke="white" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <div class="rail-brand-text">
        <div class="rail-brand-name">Обзор рынка</div>
        <div class="rail-brand-sub">Фаровон · C&amp;B <span class="sheet-ver-badge" style="margin-left:4px">v2.5.37</span></div>
      </div>
    </div>
    <div class="rail-nav" id="railNav"></div>
    <button class="rail-foot" id="railFootBtn" title="Профиль">
      <div class="rail-av" id="railAv"></div>
      <div class="rail-who"><b id="railFio"></b><span id="railRole"></span></div>
    </button>
  </div>

  <div class="app-main">
    <div class="top">
      <button id="btnBack" class="btn-ghost hidden" style="min-width:auto;padding:0 6px">‹ Назад</button>
      <h1 id="ttl">Мои подразделения<span class="sub" id="ttlSub"></span></h1>
      <div id="topPeriodBadge"></div>
      <button id="btnCmdk" class="btn-ghost top-cmdk" aria-label="Поиск по системе" title="Поиск и переходы (Ctrl/⌘ + K)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="top-cmdk-hint"><kbd>⌘K</kbd></span>
      </button>
      <button id="btnTheme" class="btn-ghost btn-icon-sq" aria-label="Тема оформления" title="Тема: как в системе"></button>
      <button id="btnHelp" class="btn-ghost" style="min-width:auto">Помощь</button>
      <button id="btnMenu" class="btn-ghost" style="min-width:auto;font-size:18px;padding:0 8px"
              aria-label="Меню">⋮</button>
    </div>
    <div id="workspaceTabs" class="workspace-tabs-bar"></div>
    <div id="topNav" class="nav-tabs hidden"></div>
    <div class="wrap" id="body"></div>
    <div class="bar hidden" id="bar">
      <div class="bar-in" style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div class="prog"><b id="progT"></b><i id="progS"></i></div>
        <div style="display:flex;align-items:center;gap:8px">
          <button id="btnNext" class="btn-line" style="width:auto;min-height:32px;font-size:13.5px;padding:0 14px">Перейти к шагу 2 →</button>
          <button id="btnSave" class="btn-primary" style="width:auto;min-height:32px;font-size:13.5px;padding:0 16px">Сохранить</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Порядок обязателен: app-core.js (рантайм) → app.js (экраны). -->
<script src="/app-core.js?v=2.5.37"></script>
<script src="/app.js?v=2.5.37"></script>
<script src="/grading.js?v=2.5.37"></script>
<script src="/tableEnhance.js?v=2.5.37" defer></script>
<script src="/smartFilter.js?v=2.5.37" defer></script>
<script src="/liveRefresh.js?v=2.5.37" defer></script>
<script src="/pwa.js?v=2.5.37" defer></script>
<script src="/pull-to-refresh.js?v=2.5.37" defer></script>

</body>
</html>
