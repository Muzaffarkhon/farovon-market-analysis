name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Уязвимости в прод-зависимостях: падаем на high и critical.
      # moderate/low приходят отдельными PR от Dependabot, сборку не рушат.
      - name: npm audit (prod, high+)
        run: npm audit --omit=dev --audit-level=high

      # Никаких паролей-заглушек и открытых паролей в исполняемом коде.
      # Ловит регресс класса worker.js: universal 'admin123' и поле raw_password.
      - name: Secret scan
        run: |
          if git grep -nE "password === ['\"]|['\"](admin123|cb123)['\"]|[.:]\s*raw_password" -- 'src/**/*.js' ':!src/tools/**'; then
            echo "::error::Пароль-заглушка или открытый пароль в коде — уберите"
            exit 1
          fi

      # Синтаксис ключевых модулей — тот же ручной CI-gate, что в отчётах.
      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/db/migrate.js
          node --check src/config/capabilities.js
          node --check src/routes/api.js

      # Проверка фронта: классы без CSS, иконки, соответствие call() маршрутам.
      # Информационно — вывод в лог, сборку не рушит.
      - name: Frontend audit
        run: node src/tools/auditFrontend.js || true

      - name: Tests
        run: npm test
